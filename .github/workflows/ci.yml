name: Run CI
on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    name: Build
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          check-latest: true
          node-version: 26.5.0

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          pnpm ci
          sudo apt update
          sudo apt install -y libimage-exiftool-perl

      - name: Build
        run: pnpm build

      - name: Check code style
        run: |
          pnpm fmt
          git --no-pager diff --exit-code

      - name: CI tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: ci
    name: Docker build and upload
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - run: docker build -t lusc.ch/recipe-store . --progress=plain

      - name: Sync
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s %s\n' "$SSH_HOST" "$SSH_HOST_KEY" > ~/.ssh/known_hosts

          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT INT TERM
          printf '%s\n' "$SSH_KEY" | ssh-add -t 1200 -

          SSH_OPTS='ssh -o StrictHostKeyChecking=yes -o BatchMode=yes'

          docker save lusc.ch/recipe-store:latest \
            | gzip \
            | $SSH_OPTS "$SSH_USERNAME@$SSH_HOST" "docker load && cd /opt/recipe-store/ && docker compose up -d --pull never --remove-orphans"
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_HOST_KEY: ${{ secrets.SSH_HOST_KEY }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
